 ruth:{hi:"Oh, hello, dear. I'm Ruth. I taught high school for thirty-one years, so forgive me if I start grading things.",again:"Back to visit an old lady? You're sweet.",more:["What else is on your mind, dear?","Go on, ask me anything. I've got nowhere to be."],bye:"Off you go, dear. And stand up straight. You're wearing a suit, make it count.",
  topics:[
   ["What do you think of this floor?",[["I love it. Most portfolios are all business. This one tells you who the person actually is.","How so?"],["Look around. Varsity esports, coaching, running shifts at a pharmacy. That's a young man who shows up for people.","He does a lot."],["He does. And in my experience, the students who teach others end up understanding things best. He coaches. That tells me plenty.","That's a great point."]]],
   ["What did you teach?",[["Chemistry. Thirty-one years of convincing teenagers the periodic table is beautiful.","Did it work?"],["Sometimes! Every few years one of them would light up, and that made all the others worth it. Like a reaction finally catching.","That's lovely."],["A few went into computing, actually. I always told them: curiosity first, the job comes later. Seems like that's how this young man did it too.","Seems like it."]]],
   ["Which photo is your favorite?",[["The airport in Garowe. That gold grass against the blue sky. My late husband would have loved it. He was a painter.","I'm sorry."],["Oh, don't be. He'd be thrilled I'm out looking at art instead of sitting at home. He always said, 'Ruth, colors don't look at themselves.'","He sounds wonderful."],["He was. And whoever took that photo understands color. You don't learn that. You either notice it or you don't.","Ahmed took all of them."]]],
   ["Any advice for someone starting out?",[["You're asking a teacher for advice? Pull up a chair, dear, this may take a while.","I've got time."],["Write down what went wrong, not just what went right. He does that on every project card. 'The hard part.' That's how you actually grow.","I noticed that too."],["And be kind to people while you're climbing. The world is small. Your coworkers today are your references tomorrow.","I'll remember that."]]]
  ]},
 kai:{hi:"Yo! Kai. I came for the esports exhibit and I've been standing here for twenty minutes.",again:"Ayy, you're back! Queue up, let's talk.",more:["What else, what else?","Hit me. I'm locked in."],bye:"GG, my friend. Go check out the rest. And tell him Kai says what's up.",
  topics:[
   ["What's so good about the esports exhibit?",[["Bro, he's on varsity AND coaches the academy team. That's like two jobs on top of school.","I didn't think of it that way."],["And coaching is so underrated. You watch VODs, point out mistakes without making people feel bad, and keep everyone calm when they're tilted.","Sounds like management."],["That's literally what it is! And SOC work is staying calm while alerts are going off. It's the same skill. The exact same skill.","That's a cool connection."]]],
   ["What do you play?",[["Mostly Valorant, a little Minecraft when I need to chill. I stream on weekends. Like nine viewers. Ten if my mom's watching.","That counts!"],["She's my biggest fan. She types 'good job sweetie' in chat every time I get a kill. My viewers like her more than me.","Ha!"],["Honestly, that's the dream though. Build something people enjoy. This whole building feels like that. Like someone built a world just to share it.","That's exactly the idea."]]],
   ["Did you see the Building Worlds panel?",[["The DanTDM one? Bro. I grew up on DanTDM too. The lab, the diamond minecart, all of it.","Same for a lot of people."],["Exactly! And now he's building actual worlds in code. That's the dream ending. Kid watches builds, kid becomes a builder.","Full circle."],["Full circle. I'm inspired. I'm going home to learn to code. Or play one more game first. Probably one more game first.","Classic."]]],
   ["Could you beat him in a 1v1?",[["Okay, honestly? I tell everybody yes. Out loud. Very confidently.","And in reality?"],["In reality, he coaches people and I play with my mom in chat. So statistically... I'd get cooked.","Respect for admitting it."],["But if he ever wants to run it, tell him Kai's ready. I'll warm up for three hours first. It'll be a whole event.","I'll let him know."]]]
  ]},
 dana:{hi:"Hi. Dana. I run a security operations team, so I'm here half for fun and half scouting. Mostly scouting.",again:"You again. Good. I like people who come back for a second look.",more:["What else would you like to know?","Go ahead. I've got a few minutes before my next meeting."],bye:"Good talk. If he ever wants a mock interview, I'm around. Tough, but fair.",
  topics:[
   ["What do you think of SecureDrop?",[["Honestly, I'm impressed. Not because it's perfect, but because of what he chose to care about.","What do you mean?"],["Salted scrypt hashing, a fresh key for every file, replay protection with sequence numbers. Most students forget replay attacks exist. He didn't.","That's a good sign?"],["A great sign. And he wrote his own roadmap: keys shouldn't travel with the file, use constant-time comparisons. Knowing your weak spots is half the job.","So you'd hire him?"],["I'd interview him, and I'd ask about the hard parts, because that's where you learn how someone thinks. Then, probably, yes.","High praise."]]],
   ["What does a SOC analyst actually do?",[["Picture a hundred smoke alarms, and ninety-eight of them are burnt toast. Your job is finding the two real fires, fast.","That sounds stressful."],["It can be. You dig through logs, rebuild timelines, figure out what happened and when. That's why the log parser in the lounge caught my eye.","The Kronos one?"],["Yes. Pairing boot starts with completions and flagging the ones that never finished? That's incident triage in miniature.","He'd love hearing that."]]],
   ["What should he work on next?",[["More blue team work. Set up a SIEM in a homelab, feed it logs, write some detection rules. Show me you can catch something.","He already has a homelab."],["Then he's halfway there. Certifications help, Security+ is a good start. But hands-on labs matter more to me than paper.","Good to know."],["And keep writing things up like these cards. Clear writing is underrated in security. Executives read incident reports, not just engineers.","That makes sense."]]],
   ["How did you get into security?",[["Help desk. Resetting fifty passwords a day. Then I noticed a pattern: the same accounts locking out at the same time every night.","Uh oh."],["Uh oh is right. Someone was brute-forcing them. I flagged it, got pulled into the investigation, and never left security.","Great origin story."],["Everyone in this field has one. The moment you realize you care about the bad guys not winning. Sounds like SecureDrop was his.","It was."]]]
  ]},
 marcus:{hi:"Hey. Marcus. Software engineer, eight years. I came for coffee and stayed to code review the walls.",again:"Back for round two? Cool, I've got more opinions.",more:["What's next?","Shoot. I have opinions on basically everything."],bye:"Alright, back to judging variable names. Good chatting with you.",
  topics:[
   ["What do you think of the tokenizer?",[["A finite state machine in MIPS assembly. By hand. With function pointers. I'd have reached for Python in five minutes.","Is that impressive?"],["Very. In assembly you can't hide. Every register, every stack frame, you manage yourself. You learn what the machine is actually doing.","And the bug fix?"],["Best part. He found a clobbered register after he turned it in, and fixed it anyway. Nobody was grading that. That's character.","Agreed."]]],
   ["What's your take on this site?",[["No framework. Just HTML, CSS, JavaScript, and a hand-written canvas engine. Part of me wants to say 'just use React.'","And the other part?"],["The other part respects it. Building without a framework means you actually understand the browser. Rendering, input, timing.","Makes sense."],["Also, the elevator has a real queue. It waits for other passengers. I spent ten minutes testing it. Don't tell my manager.","Your secret's safe."]]],
   ["Any tips for writing better code?",[["Name things like the next reader is tired and grumpy. Because it'll be you, at 2 AM.","Ha, fair."],["Small functions. Write tests before you think you need them. Delete code without fear. Version control remembers it for you.","Good rules."],["And read other people's code. Every card here has 'the hard part.' That's him code reviewing himself. More people should do that.","I like that."]]],
   ["Software engineering or security?",[["Classic debate. Honestly, I tried to recruit him to the software side in my head while reading the AniPlayer card.","Did it work?"],["No. Even on the graphics projects, he writes about how things break. That's a security brain. You can't turn it off.","So security wins?"],["Security wins. But the best security people can also build, and he clearly can. That combo is rare. I'm a little jealous.","High praise."]]]
  ]},
 lena:{hi:"Oh, hi! Sorry, I'm Lena. I'm a sophomore and I'm kind of freaking out about these projects. In a good way.",again:"Hey! You're back! I've been taking notes, look.",more:["Okay, okay, what else?","Ask me something! I love talking about this stuff."],bye:"I'm going to go stare at the Sokoban card again. Thanks for talking with me!",
  topics:[
   ["Why are you freaking out?",[["I'm taking Computing IV next year, and these are the assignments. The DNA one, the Markov one... I'm scared and excited.","You'll be fine."],["Look at the cards though. Every one has 'the hard part,' and he got stuck too! A newline broke his Sokoban. That's so relatable it's comforting.","Everyone gets stuck."],["Exactly! It makes it feel possible. He's not a genius who never had bugs. He just kept going. I can do that.","You definitely can."]]],
   ["Which project is your favorite?",[["DNA alignment. Just reading the card made dynamic programming click for me.","How?"],["He measured memory use against the 4N² formula and it matched within one percent. He checked the math against reality! I didn't know you could do that.","That's real engineering."],["Right?! And the biggest test files were too big for his laptop, exactly like the math predicted. The math was right AND the laptop suffered. Beautiful.","Poor laptop."]]],
   ["What are you studying?",[["Computer science, but I keep switching between AI and security. Every week I change my mind.","Which way are you leaning?"],["After this floor? Security. Replay attacks! I didn't know that was a thing until yesterday.","It's a rabbit hole."],["The best kind. I'm joining my school's cyber club next week. Okay, I'm really doing it. You're my witness.","I'll hold you to it."]]],
   ["Any tips you've picked up here?",[["Build stuff outside of class. The homelab, the handheld, this whole building. None of that was homework.","Good point."],["Document everything. Screenshots, what broke, what you learned. Future you needs it for interviews.","Smart."],["And make it fun. He turned his portfolio into a building with a café and a cat. Nobody's going to forget that.","Definitely not."]]]
  ]},
 sofia:{hi:"Hello. Sofia. I shoot weddings for money and skies for love. Mostly skies, honestly.",again:"You came back. Good taste brings people back.",more:["What else? I could talk about light all day.","Ask me anything. I'm in a photography mood."],bye:"Go look at the skies once more before you leave. They change every time you look.",
  topics:[
   ["What do you think of the collection?",[["He has an eye for skies. Every series up here has one. Mackerel clouds, golden hour, a sunset silhouette. He looks up a lot.","Is that rare?"],["More than you'd think. Most people photograph what's in front of them. Looking up is a habit. It means you notice what everyone else walks past.","I like that."],["My only note? I'd crop the plaza shot tighter. But maybe all that empty sky is the point. Maybe he's right and I'm wrong. Don't repeat that.","Your secret's safe."]]],
   ["How do you get a good silhouette?",[["Shoot straight into the brightest part of the sky and let your subject go dark. Don't light it. Let the shape do the talking.","Like the mosque photo."],["Exactly like that one. And timing matters. You get maybe ten minutes where the sky goes purple and pink. Miss it and it's just gray.","Ten minutes?"],["Ten minutes. That's why every photographer has been late to dinner at least once. 'Sorry, the sky was doing something.'","Ha! Relatable."]]],
   ["What about the cat photos?",[["The cats are my favorite thing on this floor. Getting a street cat to hold eye contact takes patience and luck in equal parts.","The Watcher, right?"],["The Watcher. That look says, 'I know what you did.' Then in the next frame it's grooming like nothing happened. Three acts, three frames.","I didn't see it that way."],["That's what a series is for. One photo is a moment. Three is a story. I'd bet he sequenced those on purpose.","He did."]]],
   ["Any tips for a beginner?",[["Use what you have. These were shot on a phone, and look at them. The camera matters far less than your eye.","Really?"],["Really. Learn to wait. Learn where the light is coming from. Take the shot even if you feel silly standing there.","Got it."],["And travel with your eyes open. Airports, roads, rooftops. Some of the best photos in this building are from places in between.","Good advice."]]]
  ]},
 omar:{hi:"Peace! Omar. I'm the guy who stops in the middle of the sidewalk to look at clouds. You've probably walked around me.",again:"Back again! Look up, my friend, look up.",more:["What else is on your mind?","Ask away. The clouds aren't going anywhere. Well, they are, but slowly."],bye:"Go well, my friend. And look up on your way out.",
  topics:[
   ["What's a mackerel sky?",[["See the rippled clouds in the minaret photo? Like fish scales? That's a mackerel sky. Altocumulus, if you want to sound fancy.","Cool name."],["Sailors used to say, 'Mackerel sky, not long dry.' It usually means the weather is about to change.","Is that true?"],["Often, yeah! And he caught a perfect one, with the minaret tucked in the corner. That framing is clean.","It's a great shot."]]],
   ["Why do you love skies so much?",[["Because they're never the same twice. You can walk the same street every day, but the sky above it is brand new.","That's beautiful."],["My grandfather taught me that. Every evening he sat outside with tea, just watching. I thought he was bored. Now I get it.","He sounds wise."],["He was. These photos remind me of those evenings. Golden light, a minaret, rooftops. It feels like home, in a way.","I'm glad they do."]]],
   ["Have you seen the other floors?",[["The travel photos on the first floor! Bosaso, Garowe, Dubai. That Garowe shot with the gold grass and deep blue sky? A perfect day.","They're great."],["The projects floor mostly went over my head. But the security guard told me SecureDrop guards itself, and I laughed for a solid minute.","Reyes is funny."],["She is. This whole building is like that. Every floor has its own personality, but it all fits. Like a good sky. Many layers.","Well said."]]],
   ["Any sky-watching tips?",[["Golden hour: right after sunrise and right before sunset. Everything glows. Even parking lots look like paintings.","I'll look for it."],["And right after a storm. The clouds break up into dramatic shapes with light pouring through. Best skies of the week.","Noted."],["And here's a secret: the windows in this building follow the real time and weather. Come back at night. The city lights are something else.","I'll come back."]]]
  ]},
 reyes:{hi:"Evening. Officer Reyes, building security. Relax, you're not in trouble. Unless you touch the paintings.",again:"You again. Don't worry, you're on the nice list.",more:["Anything else?","Go ahead. It's a quiet shift."],bye:"Back to my rounds. Enjoy the exhibits, and stay behind the rope.",
  topics:[
   ["What's it like guarding a museum?",[["Mostly quiet. Lots of walking, lots of telling people not to lean on the velvet rope.","Do people lean on it?"],["Every day. One guy tried to take a selfie inside the rope with SecureDrop. I let it slide. He looked so happy.","That's kind of you."],["Don't spread that around. I have a reputation. Firm, but fair. Mostly fair.","My lips are sealed."]]],
   ["Do you understand SecureDrop?",[["I asked for an explanation in security guard terms, and honestly, it made total sense.","How does it work?"],["Your password is like an ID badge, but the building never keeps a copy of the badge. Just a fingerprint it can check. Steal the records, and you still can't make badges.","That's clever."],["And replay protection is me noticing the same badge swiped twice in a row. Second swipe? Denied. I do it with eyes. He does it with math.","Same job, different tools."]]],
   ["Ever had a real incident here?",[["Once. Someone tried to sneak into the café after closing. Turned out to be Mason. He forgot his keys and wanted to finish a croissant.","Ha! Mason!"],["He told me it was a 'security test.' I wrote it up anyway. It's on his permanent record. He brings it up every week.","Of course he does."],["That's what I like about this place. The biggest threat is a barista and a pastry. I'll take it.","Sounds peaceful."]]],
   ["Is Ahmed a good fit for security?",[["Good fit. People think security is all hackers and screens, but half of it is paying attention and staying calm.","Like your job."],["Exactly like my job. I watch hallways, he'll watch networks. Same instinct: notice what doesn't belong.","I like that comparison."],["And someone who coaches a team and runs shifts knows how to keep people calm during an incident. That matters more than people think.","It really does."]]]
  ]},
 jun:{hi:"Oh! Hi. Sorry, I'm Jun. I'm sketching the rooftops photo. Want to see? It's not done yet.",again:"You're back! Look, I added the hills since last time.",more:["What else? I can talk and draw at the same time. Mostly.","Ask me anything. Just don't bump my elbow."],bye:"Okay, back to these rooftops. Come back later and see if I finished!",
  topics:[
   ["What are you drawing?",[["The rooftops and ridges photo. All those colors packed together. It's driving me a little crazy, in a good way.","Why that one?"],["Because it's a nightmare to shade. Every roof catches the light differently. If I can draw this, I can draw anything. That's my theory.","Makes sense."],["Also, my professor says I draw buildings too perfectly. This photo is messy and real. It's teaching me to loosen up.","That's a great lesson."]]],
   ["Why do you sketch here?",[["Free reference, good lighting, and a cat. That's my whole list.","Good list."],["Byte sits next to me sometimes. I tried drawing him, but he moves every time I get his ears right. Every single time.","Cats are like that."],["I think he does it on purpose. Artistic sabotage. Honestly, I respect it.","Ha!"]]],
   ["What do you study?",[["Illustration, second year. People always ask if I'm worried AI will take my job.","Are you?"],["A little. But then I come here and see a CS student who built this whole building by hand when he could have used a template. It reminds me why people make things.","That's a nice way to see it."],["Making things yourself means something. Even when it's slower. Maybe especially when it's slower.","I agree."]]],
   ["Any composition tips from these photos?",[["So many. Look at the minaret. It's in the corner, not the middle. That gives the sky room to breathe.","Huh, I see it."],["And the escalator shot uses diagonal lines to pull your eye up. Painters have used that trick for hundreds of years.","He's got an eye."],["He does. I'm stealing all of it. That's how art works. You borrow from people you admire, then make it yours.","Ha, fair."]]]
  ]},
 byte:{hi:"*Byte looks up at you and slowly blinks.* Mrrp.",again:"*Byte recognizes you and trots over.* Mrrow!",more:["*Byte waits, tail swishing.*","*Byte sits and stares, expectantly.*"],bye:"*Byte gives you one slow blink, which is cat for 'I trust you,' and goes back to his nap.*",
  topics:[
   ["Pet Byte",[["*You pet Byte. He leans into your hand and purrs like a tiny engine.*","Aww."],["*He headbutts your hand. That's cat for 'you may continue.'*","Keep petting."],["*After exactly four more pets, he decides that's enough and flops over dramatically.* Mrrp.","Fair enough."]]],
   ["Ask Byte about the cat photos",[["*Byte looks at the photo of the Watcher, then back at you, unimpressed.*","Is that a relative?"],["*He sneezes. Possibly a yes. Possibly allergies.*","Ha."],["*He sits below the photo and copies the pose exactly. He knows what he's doing.*","Iconic."]]],
   ["Offer Byte a treat",[["*You don't actually have a treat. Byte knows. Byte always knows.*","Sorry, buddy."],["*He stares at your empty hand, then at you, then toward the café downstairs. Message received.*","I'll ask Priya."],["*He follows you two steps, gets distracted by absolutely nothing, and wanders off.* Mrow.","Cats."]]]
  ]}

const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const lm=document.createElement('canvas'),lx=lm.getContext('2d');
let dpr=1,S=3,SI=3,SO=2,W=0,H=0,VW=0,VH=0,touchMode=false;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  W=Math.round(innerWidth*dpr);H=Math.round(innerHeight*dpr);
  const port=H>W*1.2;
  SI=port?Math.max(1,Math.floor(W/190)):Math.max(1,Math.min(Math.floor(H/205),Math.floor(W/240)));
  SO=port?Math.max(1,Math.floor(W/230)):Math.max(1,Math.min(Math.floor(H/330),Math.floor(W/300)));
  cv.width=W;cv.height=H;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  lm.width=Math.ceil(W/2);lm.height=Math.ceil(H/2);setScale();
}
function setScale(){S=scene==='street'?SO:SI;VW=W/S;VH=H/S}

/* ---------- time & weather ---------- */
const DAY_SECONDS=720;
let tod=(()=>{const d=new Date();return d.getHours()+d.getMinutes()/60})();
const WX={kind:'clear',cloud:.15,rain:0,snow:0,tgt:{cloud:.15,rain:0,snow:0},next:50,snowCover:0};
const WSET={clear:{cloud:.12,rain:0,snow:0},cloudy:{cloud:.85,rain:0,snow:0},rain:{cloud:.95,rain:1,snow:0},snow:{cloud:.8,rain:0,snow:1}};
function pickWeather(k){const r=Math.random();WX.kind=k||(r<.34?'clear':r<.58?'cloudy':r<.8?'rain':'snow');WX.tgt=WSET[WX.kind];WX.next=70+Math.random()*80}
pickWeather(pick(['clear','clear','cloudy','rain','snow']));
Object.assign(WX,WX.tgt);
function daylight(){return smooth(5.8,7.6,tod)*(1-smooth(17.8,19.6,tod))}
function updateWorldTime(dt){
  tod=(tod+dt*24/DAY_SECONDS)%24;WX.next-=dt;if(WX.next<=0)pickWeather();
  for(const k of['cloud','rain','snow'])WX[k]+=(WX.tgt[k]-WX[k])*Math.min(1,dt*.25);
  WX.snowCover=clamp(WX.snowCover+(WX.snow>.5?dt*.02:-dt*.012),0,1);
}
function clockText(){const h=Math.floor(tod),m=Math.floor((tod-h)*60);const hh=((h+11)%12)+1;return hh+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')}
const WNAME={clear:'Clear',cloudy:'Cloudy',rain:'Rain',snow:'Snow'};

/* ---------- sky ---------- */
const SKYW=480,SKYH=200;
const sky=document.createElement('canvas');sky.width=SKYW;sky.height=SKYH;const sx=sky.getContext('2d');
const skyline=document.createElement('canvas');skyline.width=SKYW;skyline.height=80;const skyWin=[];
(function(){const c=skyline.getContext('2d');for(let layer=0;layer<2;layer++){let x=0;
  while(x<SKYW){const bw=16+Math.floor(hash(x,layer+3)*28),bh=(layer?24:40)+Math.floor(hash(layer+9,x)*(layer?34:38));
    R(c,x,80-bh,bw,bh,layer?'#0a0d1d':'#151a36');if(hash(x,layer)>.6)R(c,x+bw/2-1,80-bh-7,2,7,layer?'#0a0d1d':'#151a36');
    if(layer)for(let yy=80-bh+4;yy<77;yy+=5)for(let xx=x+3;xx<x+bw-3;xx+=4)if(hash(xx,yy)>.58)skyWin.push([xx,yy,hash(yy,xx)>.85]);
    x+=bw+(layer?0:5)}}})();
const SKYK=[[0,'#070b1e','#1a2350'],[5.4,'#070b1e','#1a2350'],[6.6,'#3a4a8a','#f2a070'],[8.4,'#3f86d6','#a8d4f5'],[16.8,'#3f86d6','#a8d4f5'],[18.6,'#4a3a7a','#ff8a5a'],[19.9,'#0b1030','#26305e'],[24,'#070b1e','#1a2350']];
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mixA(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t)}
function rgb(a){return'rgb('+a.map(v=>Math.round(v)).join(',')+')'}
function skyColors(){let i=0;while(i<SKYK.length-2&&tod>=SKYK[i+1][0])i++;const a=SKYK[i],b=SKYK[i+1],t=smooth(a[0],b[0],tod);
  let top=mixA(hx(a[1]),hx(b[1]),t),bot=mixA(hx(a[2]),hx(b[2]),t);const dl=daylight();
  const g1=dl>.3?[128,134,146]:[22,24,34],g2=dl>.3?[176,180,188]:[34,36,50];
  top=mixA(top,g1,WX.cloud*.72);bot=mixA(bot,g2,WX.cloud*.7);
  if(WX.rain>.1){top=mixA(top,[40,44,56],WX.rain*.35);bot=mixA(bot,[70,74,86],WX.rain*.3)}
  return[top,bot]}
function renderSky(){
  const c=sx,[top,bot]=skyColors(),dl=daylight();
  for(let y=0;y<SKYH;y+=4){c.fillStyle=rgb(mixA(top,bot,y/SKYH));c.fillRect(0,y,SKYW,4)}
  const night=1-dl;
  if(night>.05){c.globalAlpha=night*(1-WX.cloud*.9);for(let i=0;i<70;i++){c.fillStyle=hash(i,4)>.8?'#ffe9b0':'#dfe6ff';c.fillRect(Math.floor(hash(i,1)*SKYW),Math.floor(hash(1,i)*120),1,1)}c.globalAlpha=1}
  if(tod>5.6&&tod<19.8){const p=(tod-5.8)/13.8,x=30+p*420,y=175-Math.sin(Math.PI*clamp(p,0,1))*150;c.globalAlpha=1-WX.cloud*.85;disc(c,x,y,10,10,p<.12||p>.88?'#ffb070':'#fff2c0');disc(c,x,y,7,7,'#fffbe8');c.globalAlpha=1}
  if(tod>18.6||tod<6.8){const tt=(tod+5.4)%24,p=tt/12,x=30+p*420,y=170-Math.sin(Math.PI*clamp(p,0,1))*140;c.globalAlpha=(1-WX.cloud*.8);disc(c,x,y,7,7,'#ece6c8');R(c,x-3,y-2,2,2,'#d6cfae');R(c,x+2,y+1,2,2,'#d6cfae');c.globalAlpha=1}
  const n=3+Math.round(WX.cloud*11),col=dl>.4?(WX.rain>.3?[120,124,134]:WX.cloud>.6?[214,218,224]:[255,255,255]):[48,54,82];
  const cs=rgb(mixA(col,[255,180,140],(1-Math.abs(dl-.5)*2)*.25*(dl>.05&&dl<.95?1:0)));
  for(let i=0;i<n;i++){const w=40+hash(i,4)*70,x=((hash(i,1)*800+time*(3+hash(i,2)*6))%(SKYW+200))-120,y=12+hash(i,3)*(70+WX.cloud*20);
    c.fillStyle=cs;c.globalAlpha=.75+WX.cloud*.25;
    for(let k=0;k<5;k++){const kx=x+k*w/5,kr=(w/5)*(.7+hash(i,k+9)*.6);disc(c,kx,y+Math.sin(k)*2,kr,kr*.55,cs)}
    c.globalAlpha=1}

function updateMason(dt){

/* ---------- update ---------- */
function update(dt){
  time+=dt;bubbleCD-=dt;updateWorldTime(dt);
  updateLift(dt);for(const k in elevOpen){const k2=+k;elevTarget[k]=(lift.floor===k2&&(LIFT_STATES_OPEN.includes(lift.state)&&!(lift.state==='opening'&&lift.t<.15)))||(lift.state==='pexit'&&lift.floor===k2)?1:0;elevOpen[k]+=clamp(elevTarget[k]-elevOpen[k],-dt*2.4,dt*2.4)}
  for(const p of particles){p.y+=p.vy*dt;p.x+=Math.sin(time*3+p.y)*dt*4;p.life-=dt*.6}
  while(particles.length&&particles[0].life<=0)particles.shift();
  if(!sub.hidden&&time>subUntil)sub.hidden=true;
  if(mode==='ride'){updateRide(dt);return}
  player.study=false;if(scene==='street')updateStreet(dt);else if(scene===0)updateCafe(dt);else if(scene==='study')updateStudy(dt);else updateVisitors(scene,dt);
  updateMason(dt);
  if(paused){player.moving=false;return}
  if(player.auto){const a=player.auto;if(walkTo(player,a.tx,dt,70)){player.auto=null;a.cb&&a.cb()}return}
  let dx=0;if(keys.left)dx-=1;if(keys.right)dx+=1;
  if(player.sitting){if(dx)standUp();dx=0;player.frame=Math.floor(time*7)}
  if(player.chair){if(dx)leaveChair();dx=0}
  if(player.waitLift&&Math.abs(player.x-ELEV[scene])>70)cancelLiftCall();
  player.moving=!!dx;
  if(player.armchair&&dx){player.armchair=false;dx=0}if(player.armchair)dx=0;
  const w=scene==='street'?STREET.w:SC[scene].w;
  if(dx){player.dir=dx<0?'left':'right';player.x=clamp(player.x+dx*(performance.now()<buffUntil?150:110)*dt,20,w-20);player.ft+=dt;if(player.ft>.13){player.ft=0;player.frame++}hideHint()}
  for(const q of notes){q.y-=dt*16;q.x+=Math.sin(time*3+q.s)*dt*6;q.life-=dt*.45}while(notes.length&&notes[0].life<=0)notes.shift();
  document.getElementById('buff').hidden=performance.now()>=buffUntil;
}

function nearest(){let best=null,bd=1e9;for(const it of interactables()){const d=Math.abs(player.x-it.x)-(it.pr||0)*4;if(Math.abs(player.x-it.x)<it.half&&d<bd){bd=d;best=it}}return best}
function interact(){
  if(mode==='ride'){stepOut();return}
  if(paused||player.auto||player.inElev)return;if(player.sitting)return standUp();if(player.armchair){player.armchair=false;return}if(player.chair)return tableChat();
  const n=nearest();if(!n)return;
  switch(n.kind){
    case 'ex':openCard(n.e.id);break;
    case 'elev':callElevator();break;
    case 'study':fadeThen(()=>{scene='study';setScale();player.x=34;player.dir='right';updateHUD();setTimeout(()=>{const b=npcs.study[0];if(b)say2(b,'Mrrp?',2)},500)});break;
    case 'leaveStudy':player.armchair=false;fadeThen(()=>{scene=3;setScale();player.x=1925;player.dir='left';updateHUD()});break;
    case 'books':bookshelf();break;
    case 'fire':sys('THE FIREPLACE',"You hold your hands up to the fire. It crackles and pops. Somewhere behind you, Byte decides this is the best spot in the building and inches closer.",[['Stay a bit',()=>{endTalk();const b=npcs.study[0];if(b){b.state='walk';b.tx=clamp(player.x+18,200,540)}}],['Back away',endTalk]]);break;
    case 'armchair':player.armchair=true;player.readT=time;player.x=410;player.dir='down';hideHint();break;
    case 'laptop':sys('THE LAPTOP',"A laptop sits open on the desk. A sticky note on the screen says: 'Byte, please stop walking on the keyboard.' The terminal shows: sudo feed --cat byte --amount extra ... Permission denied. Smart laptop.",[['Ha. Close it.',endTalk]]);break;
    case 'cattree':sys('THE CAT TREE',"Three levels of carpeted luxury, with a scratching post that has clearly seen battle. A tiny brass plaque reads: 'Server Room. Authorized cats only.'",[['Respect.',endTalk]]);break;
    case 'door':fadeThen(()=>{scene='street';setScale();player.x=STREET.door;player.dir='right';updateHUD()});break;
    case 'enter':showLoading(0,()=>{scene=0;setScale();player.x=60;player.dir='right';updateHUD();if(mason.mode==='counter')setTimeout(()=>{say2(mason,'Welcome in! Come say hi.',3);voice('mason/greet')},700)});break;
    case 'menu':sys('BACK TO THE MENU','Head back to the main menu?',[['Yes, take me back',()=>{endTalk();fadeThen(()=>location.href='index.html')}],['Stay a while',endTalk]]);break;
    case 'piano':sitDown();break;
    case 'seat':sitChair(n.s);break;
    case 'mason':openMason();break;
    case 'staff':talkNamed(n.n);break;
    case 'npc':talkNPC(n.n);break;
  }
}

  if(!e.soon&&!e.sign){const nb=document.createElement('button');nb.className='pix';nb.textContent='Narration coming soon';nb.disabled=true;lk.append(nb);
    narr=new Audio('assets/voice/exhibits/'+id+'.mp3');narr.preload='auto';
    narr.addEventListener('canplaythrough',()=>{nb.disabled=false;nb.textContent='▶ Hear the narration'},{once:true});
    nb.onclick=()=>{if(narr.paused){narr.currentTime=0;narr.play().catch(()=>{});nb.textContent='■ Stop narration';if(music)music.volume=.08}else{narr.pause();nb.textContent='▶ Hear the narration';if(music)music.volume=.35}};
    narr.onended=()=>{nb.textContent='▶ Hear the narration';if(music)music.volume=.35}}
  if(lk.children.length)b.append(lk);
  cardWrap.hidden=false;b.scrollTop=0;document.getElementById('cClose').focus();
  if(!e.sign)markVisited(id);cardWrap.dataset.id=id;
}
function closeCard(){if(cardWrap.hidden)return;cardWrap.hidden=true;zoom.hidden=true;paused=false;if(narr){narr.pause();narr=null}if(music)music.volume=.35;
  if(guide===cardWrap.dataset.id)guide=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.getElementById('cClose').onclick=closeCard;cardWrap.addEventListener('click',ev=>{if(ev.target===cardWrap)closeCard()});

const listWrap=document.getElementById('listWrap');
function openList(){
  paused=true;const b=document.getElementById('lBody');b.textContent='';
  [[2,'FLOOR 2 · PROJECTS'],[1,'FLOOR 1 · ABOUT ME'],[3,'FLOOR 3 · PHOTOGRAPHY']].forEach(([f,g])=>{const h=document.createElement('div');h.className='grp';h.textContent=g;b.append(h);const grid=document.createElement('div');grid.className='list';
    ALL.filter(e=>e.floor===f&&!e.sign).forEach(e=>{const it=document.createElement('button');it.className='item';const t=document.createElement('b');t.textContent=e.title;const s=document.createElement('span');s.textContent=e.meta;const v=document.createElement('i');v.textContent=visited.has(e.id)?'✓ Seen':'Not seen yet';
      it.append(t,s,v);it.onclick=()=>{listWrap.hidden=true;openCard(e.id)};grid.append(it)});b.append(grid)});
  listWrap.hidden=false;document.getElementById('lClose').focus();
}
function closeList(){listWrap.hidden=true;paused=false}
document.getElementById('listBtn').onclick=openList;document.getElementById('lClose').onclick=closeList;listWrap.addEventListener('click',ev=>{if(ev.target===listWrap)closeList()});

/* ---------- dialog ---------- */
const dlg=document.getElementById('dialog'),dtext=document.getElementById('dtext'),choicesEl=document.getElementById('choices'),portrait=document.getElementById('portrait');
let typing=null,sel=0;
function drawPortrait(P,cat){const p=portrait.getContext('2d');p.clearRect(0,0,32,32);p.fillStyle='#2a1a14';p.fillRect(0,0,32,32);if(cat)drawCat(p,14,26,'right','sit',0);else drawPerson(p,16,46,'down',0,false,Object.assign({},P,{noShadow:1}))}
function talk(title,P,text,choices,vid,cat){if(curVoice)curVoice.pause();curVoice=voice(vid);document.getElementById('dname').textContent=title;
  if(P||cat){portrait.hidden=false;drawPortrait(P,cat)}else portrait.hidden=true;typeText(text,choices)}
function sys(title,text,choices){talk(title,null,text,choices)}
function typeText(text,choices){
  dlg.hidden=false;paused=true;choicesEl.textContent='';dtext.textContent='';let i=0;clearInterval(typing);
  const finish=()=>{clearInterval(typing);typing=null;dtext.textContent=text;showChoices(choices)};
  if(reduce)finish();else typing=setInterval(()=>{i+=2;dtext.textContent=text.slice(0,i);if(i>=text.length)finish()},22);
  dtext.onclick=()=>{if(typing)finish()};
}
function showChoices(ch){choicesEl.textContent='';sel=0;ch.forEach(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;b.onmouseenter=()=>setSel(i);choicesEl.append(b)});setSel(0)}
function setSel(i){const bs=[...choicesEl.children];if(!bs.length)return;sel=(i+bs.length)%bs.length;bs.forEach((b,j)=>b.classList.toggle('sel',j===sel));bs[sel].focus({preventScroll:true})}
function endTalk(){dlg.hidden=true;paused=false;clearInterval(typing);talkingNPC=null}
const M=(id,text,ch)=>talk('MASON · BARISTA',PAL.mason,text,ch,'mason/'+id);
function openMason(){
  if(mason.mode==='tour'){const s=TOUR[mason.stop];if(s&&s.elev&&mason.spoke&&Math.abs(mason.x-s.x)<3)return callElevator()}
  if(mason.mode==='tour')return M('tour_check',"Enjoying the tour? I can keep going, or let you explore on your own.",[['Keep going',endTalk],['End the tour',cancelTour]]);
  if(COUNTED.every(e=>visited.has(e.id))&&!store.get('gallery-all-said')){store.set('gallery-all-said','1');return M('all',LINES.all,[['Ha, thanks Mason',menu]])}
  menu();
}
function menu(){
  M('menu',LINES.menu,[
    ['Give me the tour',()=>M('tour',"A full tour, every floor? Love it. Follow me, and stay close.",[["Let's go",startTour]])],
    ['What should I see first?',()=>{guide='securedrop';M('recommend',LINES.recommend,[['Show me the way',endTalk],['Something else',menu]])}],
    ['Tell me a joke',joke],
    ['Just chat for a bit',()=>convo(mason,'mason')],
    ['Who built this place?',()=>M('story',LINES.story,[["That's a good story",menu]])],
    ['Can I get a coffee?',()=>{if(performance.now()<buffUntil)M('coffee_again',LINES.coffee_again,[['Fair enough',menu]]);else{buffUntil=performance.now()+45000;M('coffee',LINES.coffee,[['Thanks!',endTalk]])}}],
    ['Just looking, thanks',()=>M('bye',LINES.bye,[['See you',endTalk]])]
  ]);
}
function joke(){const i=(parseInt(store.get('gallery-joke')||'0',10)||0)%JOKES.length;store.set('gallery-joke',String(i+1));M('joke'+(i+1),JOKES[i],[['Another one',joke],['Ha. Okay.',menu]])}
function talkNamed(n){if(CONVOS[n.key])return convo(n,n.key);const N=NAMED[n.key],i=n.talkI%N.lines.length;n.talkI++;
  talk(N.name.toUpperCase()+' · '+N.role.toUpperCase(),n.cat?null:n.pal,N.lines[i],[['Anything else?',()=>talkNamed(n)],['See you around',endTalk]],'npc/'+n.key+'_'+(i+1),n.cat)}
function convo(n,key){
  const C=CONVOS[key],N=key==='mason'?{name:'Mason',role:'Barista'}:NAMED[key],T=N.name.toUpperCase()+' · '+N.role.toUpperCase(),P=key==='mason'?PAL.mason:(n.cat?null:n.pal),vp=key==='mason'?'mason/chat_':'npc/'+key+'_';
  const seen=n.seen||(n.seen=new Set());talkingNPC=n;
  const line=(id,text,ch)=>{talk(T,P,text,ch,vp+id,n.cat);talkingNPC=n};
  function hub(first){
    const opts=C.topics.map((t,i)=>[(seen.has(i)?'✓ ':'')+t[0],()=>run(i,0)]);
    opts.push([key==='byte'?'Let Byte nap':'I should keep exploring',()=>line('bye',C.bye,[[n.cat?'Bye, Byte':'See you!',endTalk]])]);
    if(first){const t=n.talked?C.again:C.hi;n.talked=1;line(n.talked&&t===C.again?'again':'hi',t,opts)}
    else{const i=Math.floor(Math.random()*C.more.length);line('more'+(i+1),C.more[i],opts)}
  }
  function run(i,k){const t=C.topics[i],st=t[1][k],last=k===t[1].length-1;seen.add(i);
    line('t'+(i+1)+'_'+(k+1),st[0],[[st[1],last?()=>hub(false):()=>run(i,k+1)]])}
  hub(true);
}
function bookshelf(){
  const B=[
   ["A worn MIPS reference card","Coffee stains, sticky notes, and one note in the margin: 'save $t0 BEFORE the call.' Somebody learned that the hard way."],
   ["A Minecraft redstone guide","Dog-eared to death. Several pages are bookmarked with candy wrappers. The section on logic gates has the most wrappers."],
   ["A networking textbook","The chapter on TCP and UDP is highlighted in three different colors. Next to UDP, someone wrote: 'no promises. like a cat.'"],
   ["A photo album","Pages of skies, airports, and rooftops. The last few pages are all the same courtyard cat. Byte seems jealous."],
   ["'Cats of the Internet, Volume 2'","Byte's personal copy. Several pages have been chewed. He's reviewing it harshly."],
   ["A notebook labeled 'Ideas'","A Discord soundboard bot. A handheld game console streaming setup. And at the top, underlined twice: 'turn the portfolio into a building?'"]
  ];
  const open=()=>talk("BYTE'S LIBRARY",null,"Floor-to-ceiling shelves, a rolling ladder, and the smell of old paper. Which book do you pull out?",B.map(([t,x])=>[t,()=>talk(t.toUpperCase(),null,x,[['Put it back',open],['Done browsing',endTalk]])]).concat([['Done browsing',endTalk]]));
  open();
}
function tableChat(){
  const m=playerMateSeat(),c=m&&m.taken&&m.taken.cust?m.taken:null;
  if(!c)return sys('CAFÉ TABLE',"Nobody's sitting across from you yet. Relax for a bit, and someone will probably join you.",[['Wait here',endTalk],['Stand up',()=>{endTalk();leaveChair()}]]);
  const P=PERSONAS[c.persona],T='CHATTING WITH '+c.name.toUpperCase();
  const back=()=>topics();
  function topics(){talk(T,c.pal,pick(["What's up?","So, what's on your mind?","Yeah?"]),[
    ['So, what do you do?',()=>talk(T,c.pal,P.who,[['Nice!',back]])],
    ['What brings you here?',()=>talk(T,c.pal,P.why,[['Makes sense',back]])],
    ['Have you been upstairs yet?',()=>talk(T,c.pal,P.up,[['Agreed',back]])],
    ['Anything I should see?',()=>talk(T,c.pal,P.rec,[['Thanks, I will',back]])],
    ["What are you drinking?",()=>talk(T,c.pal,"A "+c.item.toLowerCase()+". "+pick(["Priya makes it perfectly.","Third one today. Don't judge.","Mason says it's the best thing on the menu.","It's my usual."]),[['Nice',back]])],
    ['Enjoy your coffee',()=>{talk(T,c.pal,pick(['You too! Good chatting.','Nice talking to you!','Catch you around.']),[['See you',endTalk]])}]
  ])}
  talk(T,c.pal,pick(["Oh, hi! I'm "+c.name+".","Hey! I'm "+c.name+". Nice to meet you.","Hi there. "+c.name+", by the way."]),[['Nice to meet you',topics],['Never mind',endTalk]]);
}
function talkNPC(n){
  if(n.named)return talkNamed(n);
  if(n.spec)return talk('AUDIENCE',n.pal,pick(SPEC_LINES),[['Thanks!',endTalk]]);
  if(n.lob)return talk('VISITOR',n.pal,pick(["Waiting for the elevator. Heading up to the projects floor.","The café downstairs is packed today.","I heard the third floor has cat photos.","This place is way bigger than it looks from outside."]),[['Enjoy!',endTalk]]);
  if(n.cust&&n.state==='sit')return talk('CUSTOMER · '+n.name.toUpperCase(),n.pal,"Grab the seat across from me if you want to chat.",[['Okay',endTalk]]);
  if(n.cust){const lines=["Best cold brew in the city.","I come for the coffee and stay for the cats upstairs.","Have you done the tour yet? Mason's great at it.","Just waiting on my "+n.item.toLowerCase()+"."];return talk('CUSTOMER · '+n.name.toUpperCase(),n.pal,pick(lines),[['Enjoy!',endTalk]])}
  if(scene==='street')return talk('PASSERBY',n.pal,pick(["Have you been inside? Apparently there's a whole museum.","The café downstairs is great. Try the cold brew.","Nice suit. Job interview?","I heard the barista gives tours."]),[['Thanks!',endTalk]]);
  talk('VISITOR',n.pal,pick(GENERIC[scene]),[['Right?',endTalk]]);
}

/* ---------- input ---------- */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',ev=>{
  if(!loadingEl.hidden)return;
  if(!zoom.hidden){if(ev.key==='Escape')zoom.hidden=true;return}
  if(!dlg.hidden){
    if(ev.key==='ArrowDown'||ev.key==='s'){setSel(sel+1);ev.preventDefault()}else if(ev.key==='ArrowUp'||ev.key==='w'){setSel(sel-1);ev.preventDefault()}
    else if(ev.key==='Escape')endTalk();else if((ev.key==='e'||ev.key==='E')&&typing)dtext.onclick();return}
  if(!elevPanel.hidden){if(ev.key==='Escape')closePanel();const m={KeyG:0,Digit0:0,Digit1:1,Digit2:2,Digit3:3}[ev.code];if(m!==undefined&&m!==scene)chooseFloor(m);return}
  if(!cardWrap.hidden||!listWrap.hidden){if(ev.key==='Escape'){closeCard();closeList()}return}
  if(mode==='ride'){if(['KeyE','Enter','Space','ArrowUp','KeyW'].includes(ev.code)){interact();ev.preventDefault()}return}
  if(player.sitting&&/^Digit[1-8]$/.test(ev.code)){const m=[72,74,76,77,79,81,83,84][+ev.code.slice(5)-1];try{tone(m,0,1.4,.12)}catch(e){}spawnNote(0);return}
  if(player.sitting&&ev.code==='Escape'){standUp();return}
  if(KM[ev.code]){keys[KM[ev.code]]=true;ev.preventDefault()}
  if(['KeyE','Enter','Space','ArrowUp','KeyW'].includes(ev.code)){interact();ev.preventDefault()}
});
addEventListener('keyup',ev=>{if(KM[ev.code])keys[KM[ev.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function toWorld(ev){return{x:cam.x+ev.clientX*dpr/S,y:cam.y+ev.clientY*dpr/S}}
function artAt(p){return ART.find(e=>{if(e.floor!==scene)return false;const r=artRect(e);return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h})}
cv.addEventListener('click',ev=>{if(mode==='ride'){interact();return}if(paused||scene==='street')return;const a=artAt(toWorld(ev));if(a)openCard(a.id)});
cv.addEventListener('mousemove',ev=>{cv.style.cursor=mode==='world'&&scene!=='street'&&!paused&&artAt(toWorld(ev))?'zoom-in':'default'});
function enableTouch(){if(touchMode)return;touchMode=true;document.body.classList.add('touch');document.getElementById('touch').classList.add('on');document.getElementById('hint').textContent='◀ ▶ walk · A interact · tap any painting'}
if(matchMedia('(pointer: coarse)').matches)enableTouch();
addEventListener('touchstart',enableTouch,{once:true,passive:true});
document.querySelectorAll('.dpad button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))});
document.getElementById('aBtn').addEventListener('click',interact);

/* ---------- init ---------- */
['street',0,1,2,3,'study'].forEach(buildStatic);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{ICONS.intro=null;delete ICONS.intro});
addEventListener('resize',resize);resize();
if(location.hash==='#study'){scene='study';setScale();player.x=34}
const hm=location.hash.match(/floor(\d)/);if(hm&&+hm[1]<=3){scene=+hm[1];setScale();player.x=ELEV[scene]+(scene===0?-40:40)}
if(location.hash==='#list')openList();
updateHUD();setTimeout(hideHint,6000);
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__G={get scene(){return scene},set scene(v){scene=v;setScale()},player,mason,WX,setTod:v=>tod=v,get ride(){return ride},CONVOS,lift,piano,SC,playerMateSeat,dl:()=>daylight(),pickWeather,npcs,interact,TOUR,get mode(){return mode},chooseFloor,ALL,NAMED,JOKES,LINES,MASON_EXTRA,MASON_BARKS};
})();
