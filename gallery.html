const dlg=document.getElementById('dialog'),dtext=document.getElementById('dtext'),choicesEl=document.getElementById('choices');
let typing=null,sel=0,curVoice=null;
(function portrait(){const p=document.getElementById('portrait').getContext('2d');p.fillStyle='#2a1a14';p.fillRect(0,0,32,32);drawPerson(p,16,46,'down',0,false,PAL.mason)})();
function say(id,text,choices){
  if(curVoice)curVoice.pause();curVoice=voice(id);
  dlg.hidden=false;paused=true;choicesEl.textContent='';dtext.textContent='';
  let i=0;clearInterval(typing);
  const finish=()=>{clearInterval(typing);typing=null;dtext.textContent=text;showChoices(choices)};
  if(reduce)finish();else typing=setInterval(()=>{i+=2;dtext.textContent=text.slice(0,i);if(i>=text.length)finish()},22);
  dtext.onclick=()=>{if(typing)finish()};
}
function showChoices(ch){choicesEl.textContent='';sel=0;ch.forEach(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;b.onmouseenter=()=>setSel(i);choicesEl.append(b)});setSel(0)}
function setSel(i){const bs=[...choicesEl.children];if(!bs.length)return;sel=(i+bs.length)%bs.length;bs.forEach((b,j)=>b.classList.toggle('sel',j===sel));bs[sel].focus({preventScroll:true})}
function endTalk(){dlg.hidden=true;paused=false;clearInterval(typing);if(curVoice)curVoice.pause()}
function openMason(){if(COUNTED.every(e=>visited.has(e.id))&&!store.get('gallery-all-said')){store.set('gallery-all-said','1');return say('all',LINES.all,[['Ha, thanks Mason',menu]])}menu()}
function menu(){
  say('menu',LINES.menu,[
    ['Give me the tour',()=>{touring=true;guide=TOUR.find(t=>!visited.has(t))||'securedrop';say('tour',LINES.tour,[['Let\'s go',endTalk]])}],
    ['What should I see first?',()=>{guide='securedrop';say('recommend',LINES.recommend,[['Show me SecureDrop',endTalk],['Something else',menu]])}],
    ['Who built this place?',()=>say('story',LINES.story,[['That\'s a good story',menu]])],
    ['Can I get a coffee?',()=>{if(performance.now()<buffUntil)say('coffee_again',LINES.coffee_again,[['Fair enough',menu]]);else{buffUntil=performance.now()+45000;say('coffee',LINES.coffee,[['Thanks!',endTalk]])}}],
    ['Just looking, thanks',()=>say('bye',LINES.bye,[['See you',endTalk]])]
  ]);
}

let toastT=null;
function toast(t,s){const el=document.getElementById('toast');document.getElementById('toastT').textContent=t;document.getElementById('toastS').textContent=s;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,5000)}
let hintHidden=false;function hideHint(){if(hintHidden)return;hintHidden=true;const h=document.getElementById('hint');setTimeout(()=>{h.style.opacity=0;setTimeout(()=>h.hidden=true,700)},3500)}

const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',ev=>{
  if(!zoom.hidden){if(ev.key==='Escape')zoom.hidden=true;return}
  if(!dlg.hidden){
    if(ev.key==='ArrowDown'||ev.key==='s'){setSel(sel+1);ev.preventDefault()}
    else if(ev.key==='ArrowUp'||ev.key==='w'){setSel(sel-1);ev.preventDefault()}
    else if(ev.key==='Escape')endTalk();
    else if((ev.key==='e'||ev.key==='E')&&typing){dtext.onclick()}
    return;
  }
  if(!cardWrap.hidden||!listWrap.hidden){if(ev.key==='Escape'){closeCard();closeList()}return}
  if(KM[ev.code]){keys[KM[ev.code]]=true;ev.preventDefault()}
  if(ev.code==='KeyE'||ev.code==='Enter'||ev.code==='Space'||ev.code==='ArrowUp'||ev.code==='KeyW'){interact();ev.preventDefault()}
});
addEventListener('keyup',ev=>{if(KM[ev.code])keys[KM[ev.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

function enableTouch(){if(touchMode)return;touchMode=true;document.body.classList.add('touch');document.getElementById('touch').classList.add('on');document.getElementById('hint').textContent='◀ ▶ walk · A look closer · tap any painting'}
if(matchMedia('(pointer: coarse)').matches)enableTouch();
setTimeout(hideHint,4000);
addEventListener('touchstart',enableTouch,{once:true,passive:true});
document.querySelectorAll('.dpad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))});
document.getElementById('aBtn').addEventListener('click',interact);

const mb=document.getElementById('musicBtn');
mb.onclick=()=>{if(!music){music=new Audio('assets/music.mp3');music.loop=true;music.volume=.35}
  if(music.paused){music.play().then(()=>{mb.textContent='Music: on';mb.setAttribute('aria-pressed','true')}).catch(()=>{})}
  else{music.pause();mb.textContent='Music: off';mb.setAttribute('aria-pressed','false')}};

buildCity();buildBg();buildProps();updateVisited();
requestAnimationFrame(t=>{last=t;loop(t)});
if(location.hash==='#list')openList();
})();
</script>
</body>
</html>
